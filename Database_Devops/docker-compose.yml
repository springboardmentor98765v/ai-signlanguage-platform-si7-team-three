# Local development stack for the Sign Language Platform backend.
#
# Uses PostgreSQL by default, per SRS Day 2: "Set up PostgreSQL (or MySQL)
# instance for the team." If you want the simpler zero-config SQLite setup
# instead (e.g. for quick local testing without Docker), comment out the
# `db` service below and change DATABASE_URL on `backend` back to:
#   sqlite:////app/data/sign_language_platform.db

services:
  db:
    image: postgres:16-alpine
    container_name: slp_postgres
    environment:
      - POSTGRES_USER=slp_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-slp_password}
      - POSTGRES_DB=sign_language_platform
    ports:
      - "5432:5432"
    volumes:
      - slp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slp_user -d sign_language_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: slp_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://slp_user:${POSTGRES_PASSWORD:-slp_password}@db:5432/sign_language_platform
      - SLP_SECRET_KEY=${SLP_SECRET_KEY:-dev-secret-change-me-in-production}
      - SMTP_ENABLED=${SMTP_ENABLED:-false}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - CERTIFICATE_STORAGE_PATH=${CERTIFICATE_STORAGE_PATH:-/app/certificates}

    volumes:
      - slp_certificates:/app/certificates 
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- Standalone AI Prediction microservice (SRS Day 5/6) ---
  ai_service:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: slp_ai_service
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- Monitoring & Logging (PDF Infrastructure Layer) ---
  prometheus:
    image: prom/prometheus:latest
    container_name: slp_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - slp_prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: slp_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - slp_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  slp_postgres_data:
  slp_prometheus_data:
  slp_grafana_data:
  slp_certificates: